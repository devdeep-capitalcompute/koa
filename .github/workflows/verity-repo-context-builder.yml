name: Verity Repo Context Builder

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: "Verity callback URL override (optional)"
        required: false
        default: ""
      verity_project_id:
        description: "Verity project id override (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: verity-repo-context-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build_context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --upgrade pip pyyaml

      - name: Load .verity/config.yml
        id: cfg
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import os
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path(".verity/config.yml").read_text()) or {}
          verity = cfg.get("verity", {}) or {}
          callback_override = os.environ.get("VERITY_CALLBACK_OVERRIDE", "").strip()
          project_override = os.environ.get("VERITY_PROJECT_OVERRIDE", "").strip()
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
            f.write(f"project_id={project_override or str(verity.get('project_id','')).strip()}\n")
            f.write(f"callback_url={callback_override or str(verity.get('callback_url','')).strip()}\n")
          PY
        env:
          VERITY_CALLBACK_OVERRIDE: ${{ inputs.callback_url }}
          VERITY_PROJECT_OVERRIDE: ${{ inputs.verity_project_id }}

      - name: Notify Verity - started
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
        run: |
          if [ -z "$VERITY_PROJECT_TOKEN" ]; then
            echo "Skipping Verity callback: no project token"
            exit 0
          fi
          # Bootstrap substitutes the callback-URL placeholder everywhere in a
          # rendered file, so an empty-string check alone misses an
          # unsubstituted placeholder that isn't empty, just not a real URL. A
          # missing scheme catches both an empty value and that placeholder.
          case "$VERITY_CALLBACK_URL" in
            http://*|https://*) ;;
            *)
              echo "Skipping Verity callback: callback URL not configured or not substituted"
              exit 0
              ;;
          esac
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          payload = {
            "event": "workflow_started",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
          }
          print(json.dumps(payload))
          PY
            curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true

      - name: Detect repo commands
        run: python scripts/detect_repo_commands.py --merge-config > .verity/repo_context.json

      # This duplicates part of what `scripts/sync_repo_docs.py` does later in this
      # same job (both replace the same __SUGGESTED_*__/__REPO__/etc. tokens in
      # docs/REPO_CONTEXT.md) — but it is NOT dead code: sync_repo_docs.py returns
      # immediately without touching any file when policies.documentation.auto_mode
      # is false, and this workflow's job (a one-time "understand this repo" pass)
      # is supposed to fill REPO_CONTEXT.md regardless of that ongoing-sync policy.
      # When auto_mode is true, sync_repo_docs.py's own replace() calls below become
      # a harmless no-op for these same tokens (already substituted, nothing left to
      # replace) — so the duplication is real but each half is load-bearing for a
      # different auto_mode setting. Keep the two token lists in sync if either
      # changes.
      - name: Apply suggestions to docs/REPO_CONTEXT.md
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import json, time
          from pathlib import Path

          ctx = json.loads(Path(".verity/repo_context.json").read_text())
          def fmt(cmds):
            return "\n".join([f"- `{c}`" for c in cmds]) if cmds else "_(none detected)_"

          p = Path("docs/REPO_CONTEXT.md")
          txt = p.read_text()

          txt = txt.replace("__DETECTED_AT__", time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime(ctx["detected_at"])))
          txt = txt.replace("__REPO__", "${{ github.repository }}")
          txt = txt.replace("master", "${{ github.ref_name }}")

          txt = txt.replace("__SUGGESTED_SETUP__", fmt(ctx.get("setup", [])))
          txt = txt.replace("__SUGGESTED_TEST__", fmt(ctx.get("test", [])))
          txt = txt.replace("__SUGGESTED_BUILD__", fmt(ctx.get("build", [])))
          txt = txt.replace("__SUGGESTED_DEPLOY__", fmt(ctx.get("deploy", [])))

          p.write_text(txt)
          PY

      - name: Apply suggestions to .verity/config.yml (only if empty)
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import json
          from pathlib import Path
          import yaml

          cfg_path = Path(".verity/config.yml")
          cfg = yaml.safe_load(cfg_path.read_text()) or {}
          commands = cfg.get("commands") or {}
          ctx = json.loads(Path(".verity/repo_context.json").read_text())

          def is_empty(v):
            return v is None or v == [] or v == ""

          changed = False
          for k in ["setup","test","build","deploy"]:
            if k in commands and not is_empty(commands.get(k)):
              continue
            sugg = ctx.get(k, [])
            if sugg:
              commands[k] = sugg
              changed = True

          test_groups = commands.get("test_groups") if isinstance(commands.get("test_groups"), dict) else {}
          ctx_groups = ctx.get("test_groups", {}) if isinstance(ctx.get("test_groups"), dict) else {}
          for k in ["unit", "integration", "e2e"]:
            if not is_empty(test_groups.get(k)):
              continue
            sugg = ctx_groups.get(k, [])
            if sugg:
              test_groups[k] = sugg
              changed = True
          if test_groups:
            commands["test_groups"] = test_groups

          automation = cfg.get("automation") if isinstance(cfg.get("automation"), dict) else {}
          if not automation.get("test_auto_fix"):
            automation["test_auto_fix"] = ctx.get("auto_fix", {})
            changed = True
          if not automation.get("e2e"):
            automation["e2e"] = {
              "enabled": "auto",
              "command": ctx_groups.get("e2e", []),
              "start_command": (ctx.get("e2e", {}) or {}).get("start_command", ""),
              "base_url": (ctx.get("e2e", {}) or {}).get("base_url", ""),
              "base_url_env": (ctx.get("e2e", {}) or {}).get("base_url_env", "PLAYWRIGHT_BASE_URL"),
              "required_env": (ctx.get("e2e", {}) or {}).get("required_env", []),
            }
            changed = True

          cfg["commands"] = commands
          if automation:
            cfg["automation"] = automation
          if changed:
            cfg_path.write_text(yaml.safe_dump(cfg, sort_keys=False))
          PY

      - name: Sync docs context (auto document mode)
        env:
          # The repository's own default branch. verity-auto-docs.yml passes
          # this when it regenerates the same file to check staleness; running
          # the script bare here fell back to `main`, so on a repository whose
          # default branch is anything else this step committed one value and
          # the check demanded another, failing every pull request forever.
          VERITY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/sync_repo_docs.py

      - name: Upload suggested repo context artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verity-repo-context-suggestions
          path: |
            .verity/repo_context.json
            .verity/config.yml
            docs/REPO_CONTEXT.md
            docs/AI_HANDOFF.md
          if-no-files-found: ignore

      - name: Notify Verity - completed
        if: ${{ always() }}
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$VERITY_PROJECT_TOKEN" ]; then
            echo "Skipping Verity callback: no project token"
            exit 0
          fi
          # Bootstrap substitutes the callback-URL placeholder everywhere in a
          # rendered file, so an empty-string check alone misses an
          # unsubstituted placeholder that isn't empty, just not a real URL. A
          # missing scheme catches both an empty value and that placeholder.
          case "$VERITY_CALLBACK_URL" in
            http://*|https://*) ;;
            *)
              echo "Skipping Verity callback: callback URL not configured or not substituted"
              exit 0
              ;;
          esac
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          payload = {
            "event": "workflow_completed",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "status": os.environ.get("JOB_STATUS"),
            "artifact_name": "verity-repo-context-suggestions"
          }
          print(json.dumps(payload))
          PY
            curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true
