name: Verity Deploy (AWS backend + Vercel frontend)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment name (e.g. staging, production). Controls approvals."
        required: true
        default: "staging"
      deploy_backend:
        description: "Deploy backend: true/false, or empty to decide from commands.deploy in .verity/config.yml"
        required: false
        default: ""
      deploy_frontend:
        description: "Deploy frontend: true/false, or empty to decide from whether Vercel secrets are configured"
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA). If empty, uses default branch HEAD."
        required: false
        default: ""
      callback_url:
        description: "Verity callback URL override (optional)"
        required: false
        default: ""
      verity_project_id:
        description: "Verity project id override (optional)"
        required: false
        default: ""
      enable_deploy:
        description: "Explicit deploy policy acknowledgment (true/false)"
        required: false
        default: "false"
      deployment_id:
        description: "Verity deployment id (optional) — echoed back on both callbacks so the record this run belongs to is unambiguous"
        required: false
        default: ""

permissions:
  contents: read
  deployments: write

# Deploy is the one workflow in this bundle that moves real infrastructure, so it
# gets the tightest race protection: a second dispatch against the same
# environment queues instead of racing or cancelling a live deploy mid-flight.
concurrency:
  group: verity-deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounds the worst case (a hung `commands.deploy` entry or a stalled Vercel
    # build) instead of running to GitHub's default 360-minute ceiling.
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      # The project token is needed whatever is being deployed — without it no
      # callback can be sent, and a deploy Verity cannot hear about is worse than
      # one that never started.
      - name: Verify callback secret
        run: |
          if [ -z "${{ secrets.VERITY_PROJECT_TOKEN }}" ]; then
            echo "Missing required secret VERITY_PROJECT_TOKEN" >&2
            exit 1
          fi

      # Unconditional: loading .verity/config.yml needs Python, and this step used
      # to be gated on `deploy_backend == 'true'`. It only ever worked because the
      # runner image happens to ship a system Python — a backend-less deploy was one
      # image change away from failing in the config loader.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --upgrade pip pyyaml

      - name: Load .verity/config.yml
        id: cfg
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import os
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path(".verity/config.yml").read_text()) or {}
          verity = cfg.get("verity", {}) or {}
          commands = cfg.get("commands", {}) or {}
          policies = cfg.get("policies", {}) or {}
          deploy_policy = policies.get("deploy", {}) or {}
          callback_override = os.environ.get("VERITY_CALLBACK_OVERRIDE", "").strip()
          project_override = os.environ.get("VERITY_PROJECT_OVERRIDE", "").strip()
          def norm_list(v):
            if v is None: return []
            if isinstance(v, list): return [str(x) for x in v if str(x).strip()]
            if isinstance(v, str) and v.strip(): return [v.strip()]
            return []
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
            f.write(f"project_id={project_override or str(verity.get('project_id','')).strip()}\n")
            f.write(f"callback_url={callback_override or str(verity.get('callback_url','')).strip()}\n")
            f.write("deploy_cmds<<EOF\n" + "\n".join(norm_list(commands.get('deploy'))) + "\nEOF\n")
            f.write(f"deploy_policy_enabled={bool(deploy_policy.get('enabled', False))}\n")
            # production_manual / cooldown_minutes / duplicate_ref_policy are enforced
            # below (see "Enforce explicit deploy policy" and "Enforce deploy cadence
            # & duplicate-ref policy"). automation.limits.* (max_active_runs,
            # max_daily_actions_per_project, max_workflow_dispatches_per_hour) and
            # policies.deploy.allow_bootstrap_runtime_deploys are deliberately NOT
            # read here: they need state (a counter across runs, or "which system
            # dispatched this") that only Verity's backend holds before it ever calls
            # this workflow. This file has no way to enforce them on its own.
            f.write(f"production_manual={bool(deploy_policy.get('production_manual', False))}\n")
            f.write(f"cooldown_minutes={int(deploy_policy.get('cooldown_minutes', 0) or 0)}\n")
            f.write(f"duplicate_ref_policy={str(deploy_policy.get('duplicate_ref_policy', 'allow')).strip().lower()}\n")
          PY
        env:
          VERITY_CALLBACK_OVERRIDE: ${{ inputs.callback_url }}
          VERITY_PROJECT_OVERRIDE: ${{ inputs.verity_project_id }}

      # What this run actually deploys.
      #
      # `deploy_backend` and `deploy_frontend` used to default to "true", and
      # Verity's `productionDeploymentService` never sets either — so every
      # dispatched publish claimed to deploy an AWS backend. A frontend-only project
      # (which is what the service's own header describes: "a project's production is
      # its Vercel-hosted app") then hard-failed on the very first step for want of
      # AWS_REGION. Publishing could not succeed for those projects at all.
      #
      # Resolved from what the project has actually configured, because the workflow
      # already knows: it hard-fails the backend step when `commands.deploy` is empty,
      # so treating empty as "there is no backend to deploy" turns a guaranteed
      # failure into a correct skip. Same for the frontend and its Vercel secrets.
      #
      # An explicit `true`/`false` input still wins, so nothing loses control.
      - name: Resolve deploy targets
        id: targets
        env:
          INPUT_BACKEND: ${{ inputs.deploy_backend }}
          INPUT_FRONTEND: ${{ inputs.deploy_frontend }}
          DEPLOY_CMDS: ${{ steps.cfg.outputs.deploy_cmds }}
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          normalize() {
            printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'
          }

          resolve() {
            # $1 = explicit input, $2 = derived default
            val="$(normalize "$1")"
            case "$val" in
              true|1|yes|on)   echo "true" ;;
              false|0|no|off)  echo "false" ;;
              *)               echo "$2" ;;
            esac
          }

          derived_backend="false"
          if [ -n "$(printf '%s' "$DEPLOY_CMDS" | tr -d '[:space:]')" ]; then
            derived_backend="true"
          fi

          derived_frontend="false"
          if [ "$(normalize "$HAS_VERCEL")" = "true" ]; then
            derived_frontend="true"
          fi

          backend="$(resolve "$INPUT_BACKEND" "$derived_backend")"
          frontend="$(resolve "$INPUT_FRONTEND" "$derived_frontend")"

          # Refused rather than reported as a success. A run that deploys nothing and
          # exits 0 makes Verity record the release as live, which is the most
          # damaging thing this workflow could do: the product would claim a version
          # is serving users when nothing was published.
          if [ "$backend" != "true" ] && [ "$frontend" != "true" ]; then
            reason="Nothing to deploy: no commands.deploy in .verity/config.yml and no Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) configured."
            echo "$reason" >&2
            echo "VERITY_FAILURE_REASON=$reason" >> "$GITHUB_ENV"
            exit 1
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Deploy targets -> backend=$backend frontend=$frontend"

      # Checked against the resolved targets, not the inputs, so a project is never
      # asked for credentials it does not need.
      - name: Verify target secrets
        env:
          BACKEND: ${{ steps.targets.outputs.backend }}
          FRONTEND: ${{ steps.targets.outputs.frontend }}
        run: |
          fail() {
            echo "$1" >&2
            echo "VERITY_FAILURE_REASON=$1" >> "$GITHUB_ENV"
            exit 1
          }
          if [ "$FRONTEND" = "true" ]; then
            if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
              fail "Missing Vercel secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            fi
          fi
          if [ "$BACKEND" = "true" ]; then
            if [ -z "${{ secrets.AWS_REGION }}" ]; then
              fail "Missing AWS_REGION"
            fi
            if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
              if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
                fail "Missing AWS auth: AWS_ROLE_TO_ASSUME (OIDC) OR AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY"
              fi
            fi
          fi

      - name: Set up Node
        if: ${{ steps.targets.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enforce explicit deploy policy
        env:
          CONFIG_POLICY_ENABLED: ${{ steps.cfg.outputs.deploy_policy_enabled }}
          INPUT_POLICY_ENABLED: ${{ inputs.enable_deploy }}
          VAR_POLICY_ENABLED: ${{ vars.VERITY_ENABLE_DEPLOY }}
        run: |
          normalize() {
            val="$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            if [ "$val" = "1" ] || [ "$val" = "true" ] || [ "$val" = "yes" ] || [ "$val" = "on" ]; then
              echo "true"
            else
              echo "false"
            fi
          }

          config_enabled="$(normalize "$CONFIG_POLICY_ENABLED")"
          input_enabled="$(normalize "$INPUT_POLICY_ENABLED")"
          var_enabled="$(normalize "$VAR_POLICY_ENABLED")"

          if [ "$config_enabled" != "true" ] && [ "$input_enabled" != "true" ] && [ "$var_enabled" != "true" ]; then
            reason="Deploy blocked: this project has not opted in. Enable policies.deploy.enabled in .verity/config.yml, or set repo variable VERITY_ENABLE_DEPLOY=true."
            echo "$reason" >&2
            # Carried to the completion callback so Verity can tell the user *why* the
            # publish failed. Without it the product shows a bare "failed" and the
            # explanation lives only in a workflow log the user may not be able to open.
            echo "VERITY_FAILURE_REASON=$reason" >> "$GITHUB_ENV"
            exit 1
          fi

          # policies.deploy.production_manual is meant to force a human's own
          # click on every production release, not just "automation is enabled
          # somewhere." A standing repo variable (VAR_POLICY_ENABLED) or a
          # config flag (CONFIG_POLICY_ENABLED) can be set once and forgotten;
          # only the `enable_deploy` input is a decision made on *this*
          # dispatch. So when production_manual is on, production deploys
          # require that input specifically — the other two no longer count.
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ steps.cfg.outputs.production_manual }}" = "True" ] && [ "$input_enabled" != "true" ]; then
            reason="Deploy blocked: policies.deploy.production_manual is enabled, so production deploys need an explicit enable_deploy=true acknowledgment on this dispatch — a standing config/repo-variable flag is not enough for production."
            echo "$reason" >&2
            echo "VERITY_FAILURE_REASON=$reason" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Enforce deploy cadence & duplicate-ref policy
        id: cadence
        if: ${{ steps.cfg.outputs.cooldown_minutes != '0' || steps.cfg.outputs.duplicate_ref_policy == 'block' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          TARGET_SHA: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          COOLDOWN_MINUTES: ${{ steps.cfg.outputs.cooldown_minutes }}
          DUPLICATE_REF_POLICY: ${{ steps.cfg.outputs.duplicate_ref_policy }}
        with:
          script: |
            const env = process.env.DEPLOY_ENV;
            const sha = process.env.TARGET_SHA;
            const cooldown = parseInt(process.env.COOLDOWN_MINUTES || '0', 10) || 0;
            const dupPolicy = (process.env.DUPLICATE_REF_POLICY || 'allow').trim().toLowerCase();

            function block(reason) {
              core.exportVariable('VERITY_FAILURE_REASON', reason);
              core.setFailed(reason);
            }

            let deployments;
            try {
              const res = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: env,
                per_page: 30,
              });
              deployments = res.data;
            } catch (err) {
              // A history lookup failing must never itself block a deploy — that
              // would turn a read-only guardrail into a new way to break releases.
              core.warning(`Could not read deployment history for ${env}, skipping cadence/duplicate-ref checks: ${err.message}`);
              return;
            }

            if (dupPolicy === 'block') {
              const sameSha = deployments.find(d => d.sha === sha);
              if (sameSha) {
                block(`Deploy blocked: commit ${sha.slice(0, 7)} was already deployed to ${env} (deployment #${sameSha.id}). duplicate_ref_policy is "block" in .verity/config.yml — push a new commit, or change the policy, to redeploy the same ref.`);
                return;
              }
            }

            if (cooldown > 0 && deployments.length > 0) {
              const mostRecentMs = Math.max(...deployments.map(d => new Date(d.created_at).getTime()));
              const minutesSince = (Date.now() - mostRecentMs) / 60000;
              if (minutesSince < cooldown) {
                const waitMinutes = Math.ceil(cooldown - minutesSince);
                block(`Deploy blocked: the last deploy to ${env} was ${Math.floor(minutesSince)}m ago; policies.deploy.cooldown_minutes is ${cooldown}m. Wait ~${waitMinutes}m and retry.`);
              }
            }

      - name: Notify Verity - started
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_BACKEND: ${{ steps.targets.outputs.backend }}
          DEPLOY_FRONTEND: ${{ steps.targets.outputs.frontend }}
          VERITY_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          VERITY_COMMIT_SHA: ${{ inputs.ref }}
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          targets = []
          if str(os.environ.get("DEPLOY_BACKEND", "")).lower() == "true":
            targets.append("aws")
          if str(os.environ.get("DEPLOY_FRONTEND", "")).lower() == "true":
            targets.append("vercel")
          payload = {
            "event": "deployment_started",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "environment": os.environ.get("DEPLOY_ENV"),
            "deployment_targets": targets,
            "deployment_id": os.environ.get("VERITY_DEPLOYMENT_ID") or None,
            "commit_sha": os.environ.get("VERITY_COMMIT_SHA") or None,
          }
          print(json.dumps(payload))
          PY
            curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true

      - name: Determine AWS auth mode
        id: aws_auth
        if: ${{ steps.targets.outputs.backend == 'true' }}
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.targets.outputs.backend == 'true' && steps.aws_auth.outputs.use_oidc == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (static keys)
        if: ${{ steps.targets.outputs.backend == 'true' && steps.aws_auth.outputs.use_oidc == 'false' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # A deploy that cannot name where it landed is not a deploy Verity can
      # record. `commands.deploy` is opaque shell — it may be SAM, CDK,
      # Terraform, a Makefile — so the only way to learn the resulting URL is
      # to ask for it. The contract: write `verity_url=<base URL>` to
      # $GITHUB_OUTPUT (or to $VERITY_URL_FILE, which is easier from inside a
      # script that is not itself the step). Documented in
      # `.github/codex/prompts/deploy.md`.
      #
      # Without this, a backend-only project deployed successfully and Verity
      # recorded no URL, so it could never health-check the result, never test
      # it, and never reach `live` — the deploy silently produced no evidence.
      - name: Deploy backend (commands.deploy)
        id: backend_deploy
        if: ${{ steps.targets.outputs.backend == 'true' }}
        env:
          VERITY_ENVIRONMENT: ${{ inputs.environment }}
          VERITY_COMMIT_SHA: ${{ inputs.ref }}
          # Through the environment, never interpolated into the script body.
          # `<<< "${{ steps.cfg.outputs.deploy_cmds }}"` pasted the raw config
          # value inside a double-quoted string, so a deploy command containing
          # a quote — `aws s3 sync . s3://b --exclude "*.map"`, say — broke the
          # shell before it ran, with an error naming neither the command nor
          # the file it came from. The gate above already reads it this way.
          DEPLOY_CMDS: ${{ steps.cfg.outputs.deploy_cmds }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_CMDS" ]; then
            echo "No commands.deploy configured in .verity/config.yml" >&2
            exit 1
          fi
          export VERITY_URL_FILE="$(mktemp)"
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::backend deploy: $cmd"
            bash -lc "$cmd"
            echo "::endgroup::"
          done <<< "$DEPLOY_CMDS"
          if [ -s "$VERITY_URL_FILE" ]; then
            url="$(tr -d '\r\n' < "$VERITY_URL_FILE")"
            echo "verity_url=$url" >> "$GITHUB_OUTPUT"
            echo "Backend deployed to: $url"
          fi

      # Fails the run rather than reporting a success Verity cannot describe.
      # Only when the backend is the *only* target: a project that also deploys
      # a frontend already reports that URL as the environment's address.
      - name: Require a deploy URL when the backend is the only target
        if: ${{ steps.targets.outputs.backend == 'true' && steps.targets.outputs.frontend != 'true' }}
        env:
          # Through the environment, like `DEPLOY_CMDS` above. This value comes
          # from the customer's own deploy command, so interpolating it into the
          # script body would let a URL containing a quote break the step — the
          # same fault the step above was changed to avoid.
          VERITY_URL: ${{ steps.backend_deploy.outputs.verity_url }}
        run: |
          if [ -z "$VERITY_URL" ]; then
            reason="Deploy finished but never said where it landed. Have your deploy command write its base URL to \$GITHUB_OUTPUT as verity_url (or append it to \$VERITY_URL_FILE), so Verity can health-check and test what you shipped."
            echo "VERITY_FAILURE_REASON=$reason" >> "$GITHUB_ENV"
            echo "$reason" >&2
            exit 1
          fi

      - name: Install Vercel CLI
        if: ${{ steps.targets.outputs.frontend == 'true' }}
        run: npm i -g vercel@latest

      # `vercel pull`/`build`/`deploy` only accept `production` as a *promoting*
      # environment; every other value (including this workflow's own
      # `staging` default) must map to `preview` or `vercel pull` itself fails
      # before anything is built. And `deploy` without `--prod` always creates
      # a preview deployment on a throwaway URL — it never aliases the
      # production domain, however `--environment` was set. Before this, a
      # "publish to production" dispatch built with preview env vars and
      # deployed a preview: Verity recorded that preview URL as the project's
      # production, and the live domain was never touched. Both faults are
      # fixed together because a build built without `--prod` still carries
      # the wrong config even if the deploy step were fixed alone.
      - name: Resolve Vercel environment
        id: vercel_env
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "pull_env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "pull_env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Vercel build + deploy
        id: vercel
        if: ${{ steps.targets.outputs.frontend == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PULL_ENV: ${{ steps.vercel_env.outputs.pull_env }}
          VERCEL_PROD_FLAG: ${{ steps.vercel_env.outputs.prod_flag }}
        run: |
          vercel pull --yes --environment="$VERCEL_PULL_ENV" \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID"
          vercel build $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt $VERCEL_PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      - name: Notify Verity - completed
        if: always()
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_ENV: ${{ inputs.environment }}
          VERCEL_URL: ${{ steps.vercel.outputs.url }}
          VERITY_URL: ${{ steps.backend_deploy.outputs.verity_url }}
          VERITY_FAILURE_REASON: ${{ env.VERITY_FAILURE_REASON }}
          DEPLOY_BACKEND: ${{ steps.targets.outputs.backend }}
          DEPLOY_FRONTEND: ${{ steps.targets.outputs.frontend }}
          VERITY_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          VERITY_COMMIT_SHA: ${{ inputs.ref }}
        run: |
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          targets = []
          if str(os.environ.get("DEPLOY_BACKEND", "")).lower() == "true":
            targets.append("aws")
          if str(os.environ.get("DEPLOY_FRONTEND", "")).lower() == "true":
            targets.append("vercel")
          payload = {
            "event": "deployment_completed",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "status": os.environ.get("JOB_STATUS"),
            "environment": os.environ.get("DEPLOY_ENV"),
            "vercel_url": os.environ.get("VERCEL_URL") or None,
            "verity_url": os.environ.get("VERITY_URL") or None,
            "deployment_targets": targets,
            "deployment_id": os.environ.get("VERITY_DEPLOYMENT_ID") or None,
            "commit_sha": os.environ.get("VERITY_COMMIT_SHA") or None,
            "failure_reason": os.environ.get("VERITY_FAILURE_REASON") or None,
          }
          print(json.dumps(payload))
          PY
            curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true
