name: Verity Codex PR Review

# Carries the dispatch correlation id into the run's display title so Verity can
# bind this run to the dispatch that created it. `workflow_dispatch` returns no
# run id, and without the binding the run cannot be tracked or cancelled.
run-name: >-
  Verity Codex PR Review${{ inputs.pr_number != '' && format(' · PR #{0}', inputs.pr_number) || '' }}${{ inputs.dispatch_id != '' && format(' · {0}', inputs.dispatch_id) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: false
        default: ""
      dispatch_id:
        description: "Verity-internal correlation id for this dispatch attempt (optional)"
        required: false
        default: ""
      pr_head_sha:
        description: "PR head SHA expected by Verity"
        required: false
        default: ""
      callback_url:
        description: "Verity callback URL override (optional)"
        required: false
        default: ""
      verity_project_id:
        description: "Verity project id override (optional)"
        required: false
        default: ""

permissions:
  # The direct Multra runner is read-only for PR review. Keep repository contents
  # read-only; only PR/issue metadata needs write authority for review feedback.
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: verity-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

jobs:
  codex_review:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && contains(join(github.event.pull_request.labels.*.name, ','), 'verity:agent')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF_FROM_EVENT: ${{ github.event.pull_request.base.ref }}
        run: |
          PR_FROM_EVENT="${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}"
          PR_FROM_INPUT="${{ inputs.pr_number }}"
          PR_NUMBER="${PR_FROM_INPUT:-$PR_FROM_EVENT}"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=${{ inputs.pr_head_sha || github.event.pull_request.head.sha || '' }}" >> "$GITHUB_OUTPUT"

          # workflow_dispatch runs carry no pull_request event context, so the base
          # branch (needed to compute the actual PR diff, not just the head) has to
          # be looked up explicitly instead of falling back to nothing.
          BASE_REF="$BASE_REF_FROM_EVENT"
          if [ -z "$BASE_REF" ] && [ -n "$PR_NUMBER" ]; then
            BASE_REF="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.base.ref' 2>/dev/null || true)"
          fi
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      # Prefer the head SHA over `refs/pull/N/merge`. GitHub deletes the merge
      # ref the moment a PR is merged or closed, and never creates one for a PR
      # with conflicts, so a run that starts after either dies at checkout with
      # `couldn't find remote ref` — retries cannot help, the ref is gone. The
      # head SHA is immutable, always resolvable, and is already what the review
      # is reported against (`pr_head_sha` / `reviewedHeadSha`).
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_sha != '' && steps.pr.outputs.head_sha || (steps.pr.outputs.number != '' && format('refs/pull/{0}/merge', steps.pr.outputs.number) || github.ref) }}
          fetch-depth: 0

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.MULTRA_API_KEY || secrets.BLUESKY_API_KEY }}" ]; then
            echo "Missing required secret MULTRA_API_KEY or BLUESKY_API_KEY" >&2
            exit 1
          fi
          if [ -z "${{ secrets.VERITY_PROJECT_TOKEN }}" ]; then
            echo "Missing required secret VERITY_PROJECT_TOKEN" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --upgrade pip pyyaml

      - name: Load .verity/config.yml
        id: cfg
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path(".verity/config.yml").read_text()) or {}
          verity = cfg.get("verity", {}) or {}
          policies = cfg.get("policies", {}) or {}
          callback_override = os.environ.get("VERITY_CALLBACK_OVERRIDE", "").strip()
          project_override = os.environ.get("VERITY_PROJECT_OVERRIDE", "").strip()
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
            f.write(f"project_id={project_override or str(verity.get('project_id','')).strip()}\n")
            f.write(f"callback_url={callback_override or str(verity.get('callback_url','')).strip()}\n")
            f.write(f"pr_review_label={str((policies.get('pr_review', {}) or {}).get('label_required','verity:agent')).strip()}\n")
          PY
        env:
          VERITY_CALLBACK_OVERRIDE: ${{ inputs.callback_url }}
          VERITY_PROJECT_OVERRIDE: ${{ inputs.verity_project_id }}

      - name: Enforce label gate for direct PR events
        if: ${{ github.event_name == 'pull_request' && steps.pr.outputs.number != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const requiredLabel = process.env.REQUIRED_LABEL || 'verity:agent';
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number
            });
            const labels = (data.labels || []).map((l) => l.name || '');
            if (!labels.includes(requiredLabel)) {
              core.setFailed(`Label gate failed: PR must include label ${requiredLabel}`);
            }
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REQUIRED_LABEL: ${{ steps.cfg.outputs.pr_review_label }}

      - name: Notify Verity - started
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # Bootstrap substitutes the callback-URL placeholder everywhere in this file,
          # including inside any equality check written against it — which turned this
          # guard into "real URL equals real URL", skipping every callback while still
          # exiting 0, so the step stayed green and Verity heard nothing. An
          # unsubstituted placeholder has no URL scheme; test for that instead.
          case "$VERITY_CALLBACK_URL" in
            http://*|https://*) ;;
            *)
              echo "Skipping callback: callback URL not configured"
              exit 0
              ;;
          esac
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          payload = {
            "event": "workflow_started",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "pr_number": os.environ.get("PR_NUMBER") or None,
            "pr_head_sha": os.environ.get("PR_HEAD_SHA") or None
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true

      # The reviewer runs against a clean checkout, so `git diff HEAD` inside the
      # sandbox is empty even when the PR is not. The diff has to be handed to it
      # as evidence. A diff we cannot read is reported as exactly that — the
      # prompt treats a missing or unavailable `## PR Diff` as `needs_changes`
      # rather than approving something it never saw.
      - name: Render PR review prompt
        id: review_prompt
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat .github/codex/prompts/pr-review.md > pr-review-prompt.md
          printf '\n## PR Diff\n\n' >> pr-review-prompt.md

          diff_file="$(mktemp)"
          names_file="$(mktemp)"
          : > "$names_file"
          base=""
          reason=""
          if [ -n "${PR_NUMBER:-}" ] && gh pr diff "$PR_NUMBER" > "$diff_file" 2>/dev/null; then
            gh pr diff "$PR_NUMBER" --name-only > "$names_file" 2>/dev/null || : > "$names_file"
            base="${BASE_SHA:-}"
          elif [ -n "${BASE_SHA:-}" ] && git fetch --no-tags origin "$BASE_SHA" >/dev/null 2>&1 \
            && git diff "$BASE_SHA"...HEAD > "$diff_file" 2>/dev/null; then
            git diff --name-only "$BASE_SHA"...HEAD > "$names_file" 2>/dev/null || : > "$names_file"
            base="$BASE_SHA"
          elif [ -n "${BASE_SHA:-}" ] && git diff "$BASE_SHA"...HEAD > "$diff_file" 2>/dev/null; then
            git diff --name-only "$BASE_SHA"...HEAD > "$names_file" 2>/dev/null || : > "$names_file"
            base="$BASE_SHA"
          elif [ -n "${BASE_REF:-}" ] && git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 \
            && git diff "origin/$BASE_REF"...HEAD > "$diff_file" 2>/dev/null; then
            git diff --name-only "origin/$BASE_REF"...HEAD > "$names_file" 2>/dev/null || : > "$names_file"
            base="origin/$BASE_REF"
          else
            reason="neither 'gh pr diff' nor a base-SHA diff could be resolved"
            : > "$diff_file"
          fi

          if [ -n "$reason" ]; then
            printf 'DIFF UNAVAILABLE: %s. Do not treat this as evidence that the PR is empty.\n' "$reason" >> pr-review-prompt.md
          elif [ ! -s "$diff_file" ]; then
            printf 'The diff resolved successfully and is empty: this PR has no file changes against its base.\n' >> pr-review-prompt.md
          else
            # The changed-file list always goes in, even when the diff body fits.
            # It is what makes a truncated diff recoverable instead of silently
            # partial: without it the prompt looks complete, and a review that
            # never saw two thirds of the files reads exactly like one that did.
            if [ -s "$names_file" ]; then
              {
                printf 'Files changed in this PR (%s):\n\n' "$(wc -l < "$names_file" | tr -d ' ')"
                sed 's/^/- /' "$names_file"
                printf '\n'
              } >> pr-review-prompt.md
            fi
            {
              printf '```diff\n'
              # -c drops any partial multibyte character the byte-wise cut leaves
              # behind, so the prompt file stays valid UTF-8.
              head -c 60000 "$diff_file" | iconv -f utf-8 -t utf-8 -c
              printf '\n```\n'
            } >> pr-review-prompt.md
            if [ "$(wc -c < "$diff_file")" -gt 60000 ]; then
              {
                printf '\nTRUNCATED: the diff above was cut at 60,000 bytes and is INCOMPLETE.\n'
                printf 'You have not seen every change. Review the remaining files from the list\n'
                printf 'above before deciding'
                if [ -n "$base" ]; then
                  printf ' e.g. with: git diff %s...HEAD -- <path>' "$base"
                fi
                printf '.\nIf you cannot read them, say so and return needs_changes rather than\n'
                printf 'approving changes you did not see.\n'
              } >> pr-review-prompt.md
            fi
          fi
          rm -f "$diff_file" "$names_file"

      - name: Run Codex review (read-only)
        id: run_codex
        uses: ./.github/actions/verity-codex-direct
        timeout-minutes: 15
        with:
          multra-api-key: ${{ secrets.MULTRA_API_KEY || secrets.BLUESKY_API_KEY }}
          model: bluesky/auto
          effort: ${{ vars.VERITY_CODEX_EFFORT != '' && vars.VERITY_CODEX_EFFORT || 'medium' }}
          prompt-file: pr-review-prompt.md
          output-file: codex-review.md
          sandbox: read-only

      - name: Parse review decision
        id: review_parse
        if: ${{ steps.run_codex.outputs.final-message != '' }}
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          python - <<'PY'
          import os, re
          message = os.environ.get("CODEX_FINAL_MESSAGE", "")

          explicit_decision = None
          explicit_match = re.search(r"^\s*VERITY_REVIEW_DECISION:\s*(approved|needs_changes)\s*$", message, re.I | re.M)
          if explicit_match:
            explicit_decision = explicit_match.group(1).lower()

          explicit_count = None
          count_match = re.search(r"^\s*VERITY_MUST_FIX_COUNT:\s*(\d+)\s*$", message, re.I | re.M)
          if count_match:
            explicit_count = int(count_match.group(1))

          must_fix_items = []
          list_match = re.search(r"^\s*VERITY_MUST_FIX_ITEMS:\s*(.+)$", message, re.I | re.M)
          if list_match:
            must_fix_items = [chunk.strip() for chunk in re.split(r"[|;]", list_match.group(1)) if chunk.strip()]
          else:
            section_match = re.search(r"Must[- ]fix([\s\S]*?)(?:\n\s*(?:Suggestions|Testing notes|What's good)\s*:|$)", message, re.I)
            if section_match:
              for raw_line in section_match.group(1).splitlines():
                line = raw_line.strip()
                if re.match(r"^[-*]\s+|^\d+\.\s+", line):
                  must_fix_items.append(re.sub(r"^[-*]\s+|^\d+\.\s+", "", line).strip())

          must_fix_count = explicit_count if explicit_count is not None else len(must_fix_items)
          # Codex is asked to always emit VERITY_REVIEW_DECISION; when it doesn't, the
          # only fallback signal is whatever must-fix bullets the regex above found —
          # and prose with no bullet list, no explicit marker, and nothing regex-matched
          # used to read as "approved" by default. That's a review that never actually
          # confirmed anything defaulting to the one outcome that skips human attention.
          # Same principle as the truncated-diff case elsewhere in this file: an
          # unclear signal is needs_changes, never a silent approval.
          if explicit_decision in ("approved", "needs_changes"):
            decision = explicit_decision
          else:
            decision = "needs_changes"
          summary = " | ".join(must_fix_items[:5])[:2000]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"decision={decision}\n")
            handle.write(f"must_fix_count={must_fix_count}\n")
            handle.write(f"must_fix_summary={summary}\n")
          PY

      - name: Post review comment
        id: review_comment
        if: ${{ steps.run_codex.outputs.final-message != '' && steps.pr.outputs.number != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const response = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: process.env.CODEX_FINAL_MESSAGE,
            });
            core.setOutput('review_url', response.data.html_url || '');
            core.setOutput('review_comment_id', String(response.data.id || ''));
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}

      - name: Post inline review comments
        if: ${{ steps.run_codex.outputs.final-message != '' && steps.pr.outputs.number != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const message = process.env.CODEX_FINAL_MESSAGE || '';
            const comments = [];
            for (const rawLine of message.split(/\r?\n/)) {
              const match = rawLine.match(/^VERITY_INLINE_COMMENT:\s*([^|]+)\|(\d+)\|(.*)$/i);
              if (!match) continue;
              const path = match[1].trim();
              const line = Number(match[2]);
              const body = match[3].trim();
              if (!path || !Number.isFinite(line) || line <= 0 || !body) continue;
              comments.push({ path, line, side: 'RIGHT', body });
            }
            if (comments.length === 0) {
              core.info('No structured inline comments emitted by Verity review.');
              return;
            }
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(process.env.PR_NUMBER),
                event: 'COMMENT',
                body: 'Verity inline review findings',
                comments: comments.slice(0, 25)
              });
            } catch (error) {
              core.warning(`Unable to post inline review comments: ${error.message}`);
            }
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}

      - name: Notify Verity
        if: always()
        continue-on-error: true
        env:
          VERITY_PROJECT_TOKEN: ${{ secrets.VERITY_PROJECT_TOKEN }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
          VERITY_CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
          REVIEW_URL: ${{ steps.review_comment.outputs.review_url }}
          REVIEW_COMMENT_ID: ${{ steps.review_comment.outputs.review_comment_id }}
          REVIEW_DECISION: ${{ steps.review_parse.outputs.decision }}
          MUST_FIX_COUNT: ${{ steps.review_parse.outputs.must_fix_count }}
          MUST_FIX_SUMMARY: ${{ steps.review_parse.outputs.must_fix_summary }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          # Bootstrap substitutes the callback-URL placeholder everywhere in this file,
          # including inside any equality check written against it — which turned this
          # guard into "real URL equals real URL", skipping every callback while still
          # exiting 0, so the step stayed green and Verity heard nothing. An
          # unsubstituted placeholder has no URL scheme; test for that instead.
          case "$VERITY_CALLBACK_URL" in
            http://*|https://*) ;;
            *)
              echo "Skipping callback: callback URL not configured"
              exit 0
              ;;
          esac
          python - <<'PY' > /tmp/verity-callback.json
          import json, os
          payload = {
            "event": "workflow_completed",
            "project_id": os.environ.get("VERITY_PROJECT_ID"),
            "repo": os.environ.get("GITHUB_REPOSITORY"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            "status": os.environ.get("JOB_STATUS"),
            "pr_number": os.environ.get("PR_NUMBER"),
            "pr_head_sha": os.environ.get("PR_HEAD_SHA") or None,
            "pr_url": os.environ.get("PR_URL"),
            "review_url": os.environ.get("REVIEW_URL") or None,
            "review_comment_id": os.environ.get("REVIEW_COMMENT_ID") or None,
            "review_decision": os.environ.get("REVIEW_DECISION") or None,
            "must_fix_count": os.environ.get("MUST_FIX_COUNT") or None,
            "must_fix_summary": os.environ.get("MUST_FIX_SUMMARY") or None,
            "pr_base_ref": os.environ.get("PR_BASE_REF") or None,
            "codex_final_message": (os.environ.get("CODEX_FINAL_MESSAGE") or "")[:20000],
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST "$VERITY_CALLBACK_URL" \
            -H "Authorization: Bearer $VERITY_PROJECT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/verity-callback.json || true
